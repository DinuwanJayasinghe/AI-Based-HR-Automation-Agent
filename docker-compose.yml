services:
  db:
    image: postgres:14-alpine
    container_name: hr_postgres
    restart: always
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_manager
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: hr_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: hr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: hr_chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./backend
    container_name: hr_backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://hr_user:hr_password@db:5432/hr_manager
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      - db
      - mongodb
      - redis
      - chromadb

  notification_service:
    build: ./microservices
    container_name: hr_notifications
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

volumes:
  pg_data:
  mongo_data:
  redis_data:
  chroma_data:
